name: Database and application validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/relational-database-architecture]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chronos-db-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Prisma, TypeScript and application tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: chronos
          POSTGRES_PASSWORD: chronos
          POSTGRES_DB: chronos_validation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chronos -d chronos_validation"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://chronos:chronos@127.0.0.1:5432/chronos_validation?schema=public
      JWT_SECRET: ci-only-secret-that-is-not-used-in-production-32bytes-min
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Generate lockfile for the exact declared dependencies
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install dependencies from generated lockfile
        run: npm ci --no-audit --no-fund

      - name: Upload generated package lock for review
        uses: actions/upload-artifact@v4
        with:
          name: chronos-package-lock
          path: package-lock.json
          if-no-files-found: error

      - name: Validate Prisma schema
        run: npm run prisma:validate

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Generate relational baseline SQL
        run: npx prisma migrate diff --from-empty --to-schema-datamodel prisma/schema.prisma --script > /tmp/chronos-relational-baseline.sql

      - name: Apply generated baseline to disposable PostgreSQL
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f /tmp/chronos-relational-baseline.sql

      - name: Verify relational tables were created
        run: |
          TABLE_COUNT=$(psql "$DATABASE_URL" -Atc "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public' AND table_type = 'BASE TABLE'")
          echo "Created $TABLE_COUNT relational tables"
          test "$TABLE_COUNT" -ge 20

      - name: Upload generated baseline SQL for review
        uses: actions/upload-artifact@v4
        with:
          name: chronos-relational-baseline-sql
          path: /tmp/chronos-relational-baseline.sql
          if-no-files-found: error

      - name: TypeScript check
        run: npm run lint

      - name: Create isolated test databases
        run: |
          createdb --host=127.0.0.1 --username=chronos chronos_security
          createdb --host=127.0.0.1 --username=chronos chronos_e2e
        env:
          PGPASSWORD: chronos

      - name: Security tests
        run: npm run test:security
        env:
          DATABASE_URL: postgresql://chronos:chronos@127.0.0.1:5432/chronos_security?schema=public
          NODE_ENV: test
          JWT_SECRET: ci-only-secret-that-is-not-used-in-production-32bytes-min

      - name: Authentication and AI E2E tests
        run: npm run test:e2e
        env:
          DATABASE_URL: postgresql://chronos:chronos@127.0.0.1:5432/chronos_e2e?schema=public
          NODE_ENV: test
          JWT_SECRET: ci-only-secret-that-is-not-used-in-production-32bytes-min

      - name: Production frontend build
        run: npm run build
